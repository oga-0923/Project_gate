<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROJECT GATE</title>
<meta name="description" content="VR・MR・スマホ・PCで遊べるオリジナルカードゲーム">
<meta name="theme-color" content="#070b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 全画面の3D卓。上に相手HUD、下に自分HUDと手札。暗い闘技場で統一した単一テーマ */
:root{
  --bg:#070b10; --panel:rgba(16,26,28,.86); --panel-solid:#14211f; --line:#2f4741;
  --fg:#eaf1ec; --muted:#93a8a1; --gate:#d9b45f; --danger:#ff6a55; --good:#5fcf95;
  --fire:#e5583c; --earth:#b08f5e; --bolt:#ecc943; --heal:#57c08a; --field:#45b0ad; --wind:#7fd0e8; --seal:#a88be0; --lore:#5f9cff; --ward:#f2e2a8;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --cw:clamp(58px,15vw,96px);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gate);outline-offset:3px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:manipulation}

.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
.hud > *{pointer-events:auto}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud-top > *{pointer-events:auto}
.brand{font-family:var(--f-display);color:var(--gate);letter-spacing:.08em;font-size:15px;align-self:center}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:12px}
.tool:hover{color:var(--fg)}
.tool.xr{color:#111;background:var(--gate);border-color:var(--gate);font-weight:700}

.pp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:left;backdrop-filter:blur(4px)}
button.pp{cursor:default}
.pp.active{border-color:color-mix(in oklab,var(--gate) 60%,var(--line))}
.pp.target{cursor:pointer;border-color:var(--danger);animation:pulse 1.1s ease-in-out infinite}
.pp.hit{animation:shake .35s ease}
.who{font-family:var(--f-display);font-size:15px;letter-spacing:.05em}
.pips{display:inline-flex;align-items:center;gap:4px}
.pip{width:10px;height:10px;border-radius:50%;background:#22362f;border:1px solid var(--line)}
.pip.life.on{background:var(--danger);border-color:var(--danger)}
.pip.en{border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.pip.en.on{background:var(--gate);border-color:var(--gate)}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;color:var(--muted);letter-spacing:.08em}
.meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbadge{font-size:11px;color:var(--el);border:1px solid color-mix(in oklab,var(--el) 60%,transparent);border-radius:999px;padding:0 8px}

.logbox{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));width:250px;max-height:150px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;pointer-events:auto}
.logbox ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.logbox li{padding-left:8px;border-left:3px solid var(--line)}
.logbox li.p0{border-left-color:var(--gate)} .logbox li.p1{border-left-color:var(--danger)}
@media (max-width:700px){ .logbox{display:none} .logbox.open{display:block;top:auto;bottom:calc(var(--cw)*1.4 + 70px)} }

.hud-bottom{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bar .pp{flex:0 1 auto}
.hint{flex:1 1 180px;min-width:0;font-size:13px;color:var(--fg);text-shadow:0 1px 4px #000}
.hint.warn{color:var(--danger)}
.endbtn{background:var(--gate);color:#111;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;letter-spacing:.05em}
.endbtn:disabled{background:#22362f;color:var(--muted);cursor:not-allowed}
.hand{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:10px 4px 2px;min-height:calc(var(--cw)*1.4 + 12px)}

.card{--el:var(--fire);position:relative;flex:0 0 auto;width:var(--cw);aspect-ratio:5/7;border-radius:8px;
  border:2px solid color-mix(in oklab,var(--el) 65%,var(--line));
  background:linear-gradient(165deg,color-mix(in oklab,var(--el) 40%,var(--panel-solid)) 0%,var(--panel-solid) 64%);
  display:grid;grid-template-rows:auto 1fr auto auto;padding:4px 5px 5px;text-align:left;cursor:pointer;overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s}
.el-fire{--el:var(--fire)} .el-earth{--el:var(--earth)} .el-bolt{--el:var(--bolt)} .el-heal{--el:var(--heal)}
.el-field{--el:var(--field)} .el-wind{--el:var(--wind)} .el-seal{--el:var(--seal)} .el-lore{--el:var(--lore)} .el-ward{--el:var(--ward)}
.card .cost{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gate);color:var(--gate);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:11px}
.card .kind{justify-self:end;font-size:8.5px;color:var(--muted)}
.card .kind.tag{color:var(--el);font-weight:700}
.card .glyph{align-self:center;justify-self:center;font-family:var(--f-display);font-size:calc(var(--cw)*.36);line-height:1;color:var(--el)}
.card .name{font-weight:700;font-size:clamp(9.5px,2.4vw,12px);line-height:1.2}
.card .text{font-size:clamp(8px,2vw,10px);line-height:1.25;color:var(--muted);margin-top:2px}
.card .stats{display:flex;justify-content:space-between;font-family:var(--f-num);font-weight:700;font-size:clamp(10px,2.8vw,13px)}
.card .atk::before{content:"ATK ";font-size:.7em;color:var(--muted)}
.card .hp::before{content:"HP ";font-size:.7em;color:var(--muted)}
.card:hover{transform:translateY(-6px)}
.card.playable{box-shadow:0 0 0 2px var(--gate),0 0 14px color-mix(in oklab,var(--gate) 50%,transparent)}
.card.dim{opacity:.5}
.card.selected{transform:translateY(-12px);box-shadow:0 0 0 3px #fff,0 10px 24px rgba(0,0,0,.6)}

#cutin{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;z-index:15;opacity:0}
#cutin.show{animation:cut 1.15s ease forwards}
#cutin .cut{display:flex;flex-direction:column;align-items:center;gap:6px}
#cutin .cap{font-family:var(--f-display);font-size:18px;letter-spacing:.08em;text-shadow:0 2px 8px #000}
#cutin .foe .cap{color:var(--danger)} #cutin .me .cap{color:var(--gate)}
#cutin .card{--cw:clamp(110px,26vw,150px);box-shadow:0 0 40px color-mix(in oklab,var(--el) 70%,transparent)}
#banner{position:fixed;left:0;right:0;top:42%;text-align:center;pointer-events:none;z-index:16;opacity:0;font-family:var(--f-display);font-size:clamp(28px,7vw,52px);letter-spacing:.12em;text-shadow:0 0 24px currentColor}
#banner.show{animation:banner 1.3s ease forwards}
#banner.me{color:var(--gate)} #banner.foe{color:var(--danger)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:14}
#flash.go{animation:flash .45s ease-out}
#fx{position:fixed;inset:0;pointer-events:none;z-index:17}
.float{position:fixed;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.9);animation:rise 1s ease-out forwards}
.float.dmg{color:var(--danger)} .float.heal{color:var(--good)} .float.info{color:var(--gate);font-family:var(--f-display);font-size:20px}

.modal{position:fixed;inset:0;z-index:30;background:rgba(5,8,10,.78);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto}
.sheet h2{margin:0 0 8px;font-family:var(--f-display);font-weight:400;color:var(--gate);font-size:20px}
.sheet ul{margin:8px 0;padding-left:1.2em;max-width:65ch}
.cardtable{overflow-x:auto}
.cardtable table{border-collapse:collapse;font-size:12.5px;min-width:480px}
.cardtable td,.cardtable th{border-bottom:1px solid var(--line);padding:4px 10px 4px 0;text-align:left}
.cardtable th{color:var(--muted);font-weight:400;font-size:11px}
.ov{background:var(--panel-solid);border:1px solid var(--gate);border-radius:14px;padding:24px 34px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.ov h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:52px;color:var(--gate);letter-spacing:.1em}
.ov p{margin:0;color:var(--muted)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);color:var(--gate);letter-spacing:.1em;z-index:40;background:var(--bg)}

@keyframes pulse{50%{filter:brightness(1.3)}}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
@keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes cut{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
@keyframes banner{0%{opacity:0;transform:scaleX(1.6)}20%{opacity:1;transform:scaleX(1)}75%{opacity:1}100%{opacity:0}}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
[hidden]{display:none!important}
.card .kind{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--cw) - 26px)}
.card .text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* --- アプリ画面 --- */
#app{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(7,11,16,.55),rgba(7,11,16,.92) 40%)}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app-top .brand{font-size:17px}
.pts{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.app-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 24px}
.screen{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,16,18,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;cursor:pointer;font-size:11px;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gate)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.panel h3,.screen h3{margin:6px 0 0;font-size:13px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.center,.center{justify-content:center;text-align:center}
.btn{background:var(--gate);color:#111;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;letter-spacing:.03em}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{background:#22362f;color:var(--muted);cursor:not-allowed}
.ghost-btn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.ghost-btn:disabled{opacity:.45;cursor:not-allowed}
.danger-btn{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:8px 14px;cursor:pointer;align-self:flex-start}
.badge{font-size:11px;color:#111;background:var(--gate);border-radius:999px;padding:1px 8px;font-weight:700}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:4px 0 0}
.okc{color:var(--good)} .warnc{color:var(--danger)}
.eyebrow{margin:0;font-family:var(--f-display);color:var(--gate);letter-spacing:.12em;font-size:14px}
input,select{font:inherit;color:var(--fg);background:#0c1416;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;flex:1}
input[type=range]{padding:0;flex:1;accent-color:var(--gate)}
.field{display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{background:none;border:0;color:var(--muted);border-radius:7px;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--gate);color:#111;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12px}
.chip.on{border-color:var(--gate);color:var(--gate)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:#0c1416;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item .meta{word-break:break-all}

/* ホーム */
.home{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.hello{display:flex;align-items:baseline;gap:10px}
.hello b{font-family:var(--f-display);font-size:18px;font-weight:400}
.packzone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.pack-status{margin:0;font-weight:700;color:var(--muted)}
.pack-status.ok{color:var(--gate)}
.pack{--tear:0;--p1:#e5583c;--p2:#2a1d33;position:relative;width:min(54vw,210px);aspect-ratio:5/7.4;border-radius:14px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:linear-gradient(160deg,var(--p1),var(--p2));box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 0 0 2px rgba(217,180,95,.65);overflow:hidden;transform:rotate(-2deg)}
.tod-morning{--p1:#f2a65a;--p2:#3b2a4a} .tod-day{--p1:#e5583c;--p2:#2a1d33} .tod-evening{--p1:#c2366a;--p2:#1e1430} .tod-night{--p1:#4a3fbf;--p2:#0d0f24}
.pack-foil{position:absolute;inset:0;background:linear-gradient(105deg,transparent calc(var(--shine) - 9%),rgba(255,255,255,.32) var(--shine),transparent calc(var(--shine) + 9%));mix-blend-mode:screen;pointer-events:none}
.pack-top{position:absolute;left:0;right:0;top:0;height:14%;background:rgba(0,0,0,.28);border-bottom:2px dashed rgba(217,180,95,.55);display:grid;place-items:center;transition:transform .35s ease}
.seal{width:34%;height:30%;border-radius:4px;background:linear-gradient(90deg,#b8923f,#f3d58a,#b8923f);transform:rotate(var(--seal))}
.pack-art{position:absolute;inset:18% 8% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.pack-logo{font-family:var(--f-display);font-size:clamp(30px,10vw,44px);letter-spacing:.12em;color:#fff3d4;text-shadow:0 0 18px rgba(255,210,120,.7)}
.pack-set{font-size:11px;letter-spacing:.14em;color:#f3d58a}
.pack-glyphs{font-family:var(--f-display);font-size:15px;letter-spacing:.3em;color:rgba(255,255,255,.55)}
.tearline{position:absolute;left:0;top:14%;height:3px;width:calc(var(--tear) * 100%);background:#fff3d4;box-shadow:0 0 12px #ffd36b}
.pack[class*="corner-"]::after{content:"";position:absolute;width:20px;height:20px;pointer-events:none}
.corner-0::after{display:none}
.corner-1::after{top:0;right:0;background:linear-gradient(225deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.corner-2::after{bottom:0;right:0;background:linear-gradient(315deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.corner-3::after{bottom:0;left:0;background:linear-gradient(45deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.corner-4::after{top:0;left:0;background:linear-gradient(135deg,var(--bg) 50%,rgba(255,255,255,.4) 50%)}
.pack.locked{filter:grayscale(.75) brightness(.55);cursor:default}
.pack.omen{animation:omen 2.6s ease-in-out infinite}
.pack.torn .pack-top{transform:translate(30%,-130%) rotate(-10deg)}
@keyframes omen{0%,100%{filter:none}50%{filter:brightness(1.1) drop-shadow(0 0 7px rgba(255,236,170,.5))}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* パック開封 */
.sheet.pack-modal{max-width:760px;background:rgba(14,20,22,.97)}
.godline{text-align:center;font-family:var(--f-display);font-size:28px;color:#ffe08a;letter-spacing:.12em;margin:0 0 8px;text-shadow:0 0 22px rgba(255,210,100,.8)}
.reveal{--cw:clamp(76px,22vw,124px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.flip{width:var(--cw);aspect-ratio:5/7;background:none;border:0;padding:0;perspective:900px;cursor:pointer}
.flip-in{position:relative;display:block;width:100%;height:100%;transition:transform .55s ease;transform-style:preserve-3d}
.reveal.fast .flip-in{transition-duration:.3s} .reveal.slow .flip-in{transition-duration:.85s}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px}
.face.back{display:grid;place-items:center;background:linear-gradient(160deg,#2a1d33,#0d0f24);border:2px solid var(--gate);font-family:var(--f-display);color:var(--gate);letter-spacing:.1em}
.face.back em{position:absolute;bottom:8px;font-style:normal;color:#fff;font-size:20px}
.flip.last .face.back{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.35)}
.face.front{transform:rotateY(180deg)}
.face.front .card{width:100%;height:100%}
.flip.r-U.on .face.front{box-shadow:0 0 16px rgba(190,215,255,.7)}
.flip.r-R.on .face.front{box-shadow:0 0 28px rgba(255,210,100,.95)}
.newb{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px}
.rar{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gate);background:var(--bg);border-radius:6px;padding:0 5px;white-space:nowrap}

/* マイカード */
.grid{--cw:clamp(78px,24vw,104px);display:flex;flex-wrap:wrap;gap:16px 10px;justify-content:center}
.grid.sm{--cw:clamp(64px,19vw,84px)}
.cell{position:relative;background:none;border:0;padding:0;cursor:pointer;width:var(--cw)}
.cell .card{cursor:pointer}
.cell .cnt{position:absolute;top:-6px;right:-6px;background:#0c1416;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:0 6px;font-family:var(--f-num)}
.cell.unowned .card{filter:grayscale(1) brightness(.4)}
.cell.maxed .card{opacity:.4}
.dlist{display:flex;flex-direction:column;gap:4px}
.drow{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:8px;background:#0c1416;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.drow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.dname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--el)}
.mini{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;width:28px;height:28px;cursor:pointer}
.detail{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.detail .card.big{--cw:150px;cursor:default}
.detail-body{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.detail-body h2{margin:0;font-family:var(--f-display);font-weight:400;color:var(--gate)}
.detail-body p{margin:0}

/* バトル */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mode-txt{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.mode-txt b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.04em}
.mode-txt p{margin:0}
.mode.off{opacity:.55}

/* 対戦中 */
#openInfo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;max-width:min(46vw,280px)}
.oi-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oi-cols ol{margin:2px 0 0;padding-left:18px}
.oi-cols li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--el)}
.ov .row{justify-content:center}
.ov .gain{color:var(--gate);font-weight:700}
.rarc{color:var(--gate);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#14211f;border:1px solid var(--gate);color:var(--fg);border-radius:10px;padding:8px 14px;opacity:0;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{animation:toast 2.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#modal{z-index:50}
@media (max-width:560px){ .stats3 .stat b{font-size:14px} .hud .tools .tool{padding:4px 8px} }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>

function t(k,p){
  const a=STR[k]; let s = a ? (a[LI] ?? a[1]) : k;
  if(p) s=s.replace(/\{(\w+)\}/g,(_,n)=>resolveParam(p[n]));
  return s;
}
function resolveParam(v){
  if(typeof v==='string'){
    if(v[0]==='@') return cardName(v.slice(1));
    if(v[0]==='#') return who(+v.slice(1));
  }
  return v==null ? '' : v;
}
function cardName(id){ return NAME[id][LI]; }
function cardMotif(id){ return MOTIF[id][LI]; }
function who(pi){ return pi===0 ? t('you') : (S?.oppName || t('cpu')); }
function cardText(id){
  const d=CARDS[id];
  if(d.evolveFrom) return t('txt.evolve',{c:'@'+d.evolveFrom});
  if(d.rush) return t('txt.rush');
  return STR['txt.'+id] ? t('txt.'+id) : '';
}
function setLang(code){
  const i=LANGS.findIndex(l=>l[0]===code); LI=i<0?1:i; LANG=LANGS[LI][0];
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : LANG;
}

const SAVE_KEY='gate.save.v1';
let SV;
function randId(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<8;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function guessLang(){ const n=(navigator.language||'ja').slice(0,2).toLowerCase(); return LANGS.some(l=>l[0]===n)?n:'en'; }
function defSave(){
  return { v:1, lang:guessLang(), collection:{...STARTER},
    decks:[{name:'',cards:{...STARTER}},{name:'',cards:{}},{name:'',cards:{}}], active:0,
    points:0, lastPack:'', pending:null,
    profile:{name:'Player', id:randId()}, friends:[],
    settings:{speed:1, view:0, hideLast:true, tableHeight:0.78, test:false},
    stats:{w:0,l:0} };
}
function loadSave(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(s && s.v===1){ const d=defSave(); return {...d, ...s, settings:{...d.settings,...(s.settings||{})}, profile:{...d.profile,...(s.profile||{})}, stats:{...d.stats,...(s.stats||{})}}; }
  }catch(e){}
  return defSave();
}
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(SV)); }catch(e){} }
function deckCount(c){ return Object.values(c||{}).reduce((s,n)=>s+(n||0),0); }
function deckName(i){ const d=SV.decks[i]; return d.name || (i===0 ? t('deck.starter') : t('deck.default',{n:i+1})); }

// デッキコード：GATE1- のあとにカードごとの枚数を並べた文字列
function deckCode(cards){ return 'GATE1-'+CARD_IDS.map(id=>Math.min(9,cards[id]||0)).join(''); }
function parseCode(code){
  const m=String(code||'').trim().toUpperCase().match(/^GATE1-(\d+)$/);
  if(!m || m[1].length!==CARD_IDS.length) return null;
  const cards={}; CARD_IDS.forEach((id,i)=>{ const n=+m[1][i]; if(n) cards[id]=Math.min(n,CONFIG.maxCopies); });
  return deckCount(cards)===CONFIG.deckSize ? cards : null;
}

/* =====================================================================
   ゲームロジック
   ===================================================================== */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms / CONFIG.animSpeed));
let S=null, uidSeq=0, gameSeq=0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDeck(counts){ const d=[]; for(const id of CARD_IDS) for(let k=0;k<(counts[id]||0);k++) d.push({uid:++uidSeq,id}); return shuffle(d); }
function newPlayer(counts){ const deck=buildDeck(counts); return { life:CONFIG.startLife, energy:0, deck, hand:deck.splice(0,CONFIG.handStart), field:Array(CONFIG.maxField).fill(null), fieldCard:null }; }
function atkOf(pi,m){ return m.atk + (S.p[pi].fieldCard==='altar' ? CONFIG.altarBonus : 0); }
function addLog(pi,key,params){ S.log.unshift({pi,key,params}); if(S.log.length>80) S.log.pop(); }
function fx(key,text,cls){ S.fx.push([key,text,cls]); }
function evoTargets(pi,d){ return S.p[pi].field.filter(m=>m && m.id===d.evolveFrom && m.summonTurn<S.turnNo); }
function blockers(pi){ return S.p[pi].field.filter(m=>m && !m.guarded); }
function slotKey(pi,m){ return `s${pi}${S.p[pi].field.indexOf(m)}`; }
function alive(gid){ return !!S && S.gid===gid; }

function startMatch(mode, friendIdx){
  const my=SV.decks[SV.active].cards;
  if(deckCount(my)!==CONFIG.deckSize){ toast(t('deck.invalid',{m:CONFIG.deckSize})); APP.tab='cards'; APP.cardsSub='decks'; APP.editing=SV.active; showApp(true); return; }
  let opp={...STARTER}, oppName=null;
  if(mode==='friend'){
    const f=SV.friends[friendIdx]; if(!f){ toast(t('bt.noFriend')); return; }
    opp=parseCode(f.code)||opp; oppName=f.name;
  }
  S = { p:[newPlayer(my),newPlayer(opp)], turn:0, turnNo:0, sel:null, busy:false, over:false, overShown:false, winner:null,
        log:[], fx:[], hint:null, hintP:null, warn:false, gid:++gameSeq, mode, friendIdx, open:mode==='open', oppName };
  clearBoard3D();
  $('#overlay').hidden=true;
  showApp(false);
  const first = Math.random()<.5 ? 0 : 1;
  addLog(null,'l.start',{p:'#'+first});
  startTurn(first);
}
function toMenu(){
  if(renderer?.xr.isPresenting) renderer.xr.getSession()?.end();
  gameSeq++; S=null; clearBoard3D();
  $('#overlay').hidden=true;
  showApp(true);
}

function startTurn(pi){
  S.turn=pi; S.turnNo++; S.sel=null; S.hint=null; S.warn=false;
  const p=S.p[pi];
  p.energy=CONFIG.maxEnergy;
  p.field.forEach(m=>{ if(m) m.canAttack=!m.frozen; });
  if(p.fieldCard==='sanctuary'){
    p.field.forEach(m=>{ if(m && m.hp<m.maxHp){ const n=Math.min(CONFIG.sanctuaryHeal,m.maxHp-m.hp); m.hp+=n; fx(slotKey(pi,m),`+${n}`,'heal'); }});
  }
  if(S.turnNo>1) draw(pi);
  showBanner(t(pi===0?'banner.you':'banner.opp'), pi===0?'me':'foe');
  render();
  if(!S.over && pi===1) cpuTurn(S.gid);
}
function endTurn(){
  if(S.over) return;
  S.p[S.turn].field.forEach(m=>{ if(m && m.frozen && m.frozenSince<S.turnNo) m.frozen=false; });
  S.p[1-S.turn].field.forEach(m=>{ if(m && m.guarded && m.guardSince<S.turnNo) m.guarded=false; });
  startTurn(1-S.turn);
}

function draw(pi){
  const p=S.p[pi];
  if(!p.deck.length){ addLog(pi,'l.deckout',{p:'#'+pi,n:CONFIG.deckOutDamage}); damagePlayer(pi,CONFIG.deckOutDamage); return; }
  const c=p.deck.shift();
  if(p.hand.length>=CONFIG.maxHand){ addLog(pi,'l.burn',{c:'@'+c.id}); return; }
  p.hand.push(c);
}

function damagePlayer(pi,n){
  const p=S.p[pi]; p.life=Math.max(0,p.life-n);
  fx(`h${pi}`,`-${n}`,'dmg');
  if(p.life<=0 && !S.over){ S.over=true; S.winner=1-pi; addLog(1-pi,'l.win',{p:'#'+(1-pi)}); finishMatch(); }
}
function finishMatch(){
  if(S.winner===0){ SV.stats.w++; SV.points+=CONFIG.winPoints; } else SV.stats.l++;
  save();
}
function damageMonster(owner,m,n){ m.hp-=n; fx(slotKey(owner,m),`-${n}`,'dmg'); killCheck(owner); }
function killCheck(pi){
  const p=S.p[pi];
  p.field.forEach((m,i)=>{ if(m && m.hp<=0){ p.field[i]=null; addLog(pi,'l.destroyed',{p:'#'+pi,c:'@'+m.id}); }});
}

// 出せない理由を [文言キー, 値] で返す。出せるなら null
function canPlay(pi,c){
  const p=S.p[pi], d=CARDS[c.id];
  if(d.cost>p.energy) return ['w.energy'];
  if(d.evolveFrom) return evoTargets(pi,d).length ? null : ['w.evolve',{c:'@'+d.evolveFrom}];
  if(d.type==='monster' && !p.field.includes(null)) return ['w.full'];
  if(d.type==='field' && p.fieldCard===c.id) return ['w.fieldSame',{c:'@'+c.id}];
  if(c.id==='heal' && p.life>=CONFIG.maxLife) return ['w.lifeMax'];
  if(c.id==='chain' && !S.p[1-pi].field.some(Boolean)) return ['w.noEnemy'];
  if(c.id==='guard' && !p.field.some(Boolean)) return ['w.noAlly'];
  if(c.id==='book' && !p.deck.length) return ['w.noDeck'];
  return null;
}

function doPlay(pi,c,target){
  const p=S.p[pi], o=1-pi, d=CARDS[c.id];
  p.energy-=d.cost;
  p.hand.splice(p.hand.indexOf(c),1);
  if(d.evolveFrom){
    const i=p.field.indexOf(target), dmg=target.maxHp-target.hp;
    p.field[i]={ uid:c.uid, id:c.id, atk:d.atk, hp:d.hp-dmg, maxHp:d.hp, summonTurn:target.summonTurn,
                 canAttack:target.canAttack, frozen:target.frozen, frozenSince:target.frozenSince,
                 guarded:target.guarded, guardSince:target.guardSince, evolvedFrom:target.uid };
    addLog(pi,'l.evolve',{p:'#'+pi,a:'@'+target.id,c:'@'+c.id});
    fx(`s${pi}${i}`,t('fx.evolve'),'info');
  } else if(d.type==='monster'){
    const i=p.field.indexOf(null);
    p.field[i]={ uid:c.uid, id:c.id, atk:d.atk, hp:d.hp, maxHp:d.hp, summonTurn:S.turnNo, canAttack:!!d.rush, frozen:false };
    addLog(pi,'l.summon',{p:'#'+pi,c:'@'+c.id});
  } else if(c.id==='fireball'){
    if(target==='face'){ addLog(pi,'l.hitFace',{p:'#'+pi,c:'@'+c.id,q:'#'+o}); damagePlayer(o,d.dmg); }
    else { addLog(pi,'l.hitMon',{p:'#'+pi,c:'@'+c.id,t:'@'+target.id}); damageMonster(o,target,d.dmg); }
  } else if(c.id==='heal'){
    p.life=Math.min(CONFIG.maxLife,p.life+d.amount);
    addLog(pi,'l.heal',{p:'#'+pi,n:d.amount});
    fx(`h${pi}`,`+${d.amount}`,'heal');
  } else if(c.id==='chain'){
    target.frozen=true; target.frozenSince=S.turnNo; target.canAttack=false;
    addLog(pi,'l.chain',{p:'#'+pi,t:'@'+target.id});
    fx(slotKey(o,target),t('fx.seal'),'info');
  } else if(c.id==='book'){
    const n=Math.min(d.draw,p.deck.length);
    for(let k=0;k<n;k++) draw(pi);
    addLog(pi,'l.draw',{p:'#'+pi,n});
    fx(`h${pi}`,`+${n}`,'info');
  } else if(c.id==='guard'){
    target.guarded=true; target.guardSince=S.turnNo;
    addLog(pi,'l.guard',{p:'#'+pi,t:'@'+target.id});
    fx(slotKey(pi,target),t('fx.guard'),'info');
  } else if(d.type==='field'){
    const old=p.fieldCard; p.fieldCard=c.id;
    if(old) addLog(pi,'l.fieldSwap',{p:'#'+pi,a:'@'+old,c:'@'+c.id});
    else addLog(pi,'l.field',{p:'#'+pi,c:'@'+c.id});
  }
}

function attack(pi,m,target){
  const o=1-pi, a=atkOf(pi,m), mk=slotKey(pi,m);
  m.canAttack=false;
  if(target==='face'){
    addLog(pi,'l.face',{c:'@'+m.id,q:'#'+o,n:a});
    damagePlayer(o,a);
  } else {
    const tk=slotKey(o,target), b=atkOf(o,target);
    addLog(pi,'l.battle',{c:'@'+m.id,a,t:'@'+target.id,b});
    target.hp-=a; m.hp-=b;
    fx(tk,`-${a}`,'dmg'); if(b>0) fx(mk,`-${b}`,'dmg');
    killCheck(o); killCheck(pi);
  }
}

async function playAnimated(pi,c,target){
  const d=CARDS[c.id], o=1-pi;
  cutIn(pi,c.id);
  if(pi===1) await sleep(650);
  if(c.id==='fireball' || c.id==='chain'){
    const to = target==='face' ? CRYSTAL[o].clone() : slotPos(o,S.p[o].field.indexOf(target)).add(new THREE.Vector3(0,1,0));
    await projectile(CRYSTAL[pi].clone().add(new THREE.Vector3(0,.4,0)), to, EL[d.el]);
  }
  if(!S) return;
  doPlay(pi,c,target);
  render();
  if(c.id==='heal') healFx(pi);
  if(c.id==='book') bookFx(pi);
  if(c.id==='guard'){ const p0=slotPos(pi,S.p[pi].field.indexOf(target)); magicCircle(V(p0.x,.06,p0.z),EL.ward,2.8,1.2); burst(V(p0.x,1,p0.z),EL.ward,60,3,1,.2,-1); }
  await sleep(d.type==='monster' ? 950 : 550);
}

async function attackAnimated(pi,m,target){
  const e=models.get(m.uid), o=1-pi;
  if(e){
    const from=e.root.position;
    const to = target==='face' ? CRYSTAL[o].clone() : slotPos(o,S.p[o].field.indexOf(target)).add(new THREE.Vector3(0,.8,0));
    const dir=to.clone().sub(from); dir.y=0; const len=dir.length(); dir.normalize();
    const back=dir.clone().multiplyScalar(-.35);
    const hit=dir.clone().multiplyScalar(Math.max(0,len-1.25)); hit.y=target==='face'?.7:.25;
    await tween(.18, k=>{ e.holder.position.copy(back).multiplyScalar(easeOut(k)); });
    await tween(.2, k=>{ e.holder.position.lerpVectors(back,hit,k*k); });
    if(!S) return;
    burst(to, EL[CARDS[m.id].el], 70, 6, .7, .24);
    burst(to, '#ffffff', 25, 4, .35, .3);
    shake(atkOf(pi,m)>=3 ? .45 : .25);
    if(atkOf(pi,m)>=3) flash();
    attack(pi,m,target);
    render();
    await tween(.35, k=>{ e.holder.position.copy(hit).multiplyScalar(1-easeOut(k)); });
  } else { attack(pi,m,target); render(); }
  await sleep(250);
}

/* ===== CPU ===== */
async function cpuTurn(gid){
  S.busy=true; render();
  await sleep(1100); if(!alive(gid)) return;
  for(let guard=0; guard<12 && !S.over; guard++){
    const pick=cpuPickPlay(); if(!pick) break;
    await playAnimated(1,pick.card,pick.target); if(!alive(gid)) return;
    await sleep(CONFIG.cpuDelay); if(!alive(gid)) return;
  }
  for(const m of [...S.p[1].field]){
    if(S.over) break;
    if(!m || !m.canAttack || !S.p[1].field.includes(m)) continue;
    const tg=cpuPickAttack(m); if(!tg) continue;
    await attackAnimated(1,m,tg); if(!alive(gid)) return;
    await sleep(CONFIG.cpuDelay); if(!alive(gid)) return;
  }
  S.busy=false;
  if(!S.over) endTurn(); else render();
}

function cpuPickPlay(){
  const p=S.p[1], o=S.p[0];
  const ok = p.hand.filter(c=>!canPlay(1,c));
  const find = id => ok.find(c=>c.id===id);
  const enemies = o.field.filter(Boolean);
  const fb = find('fireball');
  if(fb && o.life<=CARDS.fireball.dmg) return {card:fb,target:'face'};
  const ev = find('dragon');
  if(ev) return {card:ev, target:evoTargets(1,CARDS.dragon)[0]};
  const gd = find('guard');
  if(gd){
    const danger = p.field.filter(m=>m && !m.guarded && (atkOf(1,m)>=3 || m.id==='dragon') && enemies.some(e=>atkOf(0,e)>=m.hp));
    if(danger.length) return {card:gd,target:danger[0]};
  }
  const ch = find('chain');
  const threat = enemies.filter(m=>!m.frozen && atkOf(0,m)>=3).sort((a,b)=>atkOf(0,b)-atkOf(0,a))[0];
  if(ch && threat) return {card:ch,target:threat};
  if(!p.fieldCard && p.field.some(Boolean)){
    const damaged = p.field.some(m=>m && m.hp<m.maxHp);
    const f = damaged ? (find('sanctuary')||find('altar')) : (find('altar')||find('sanctuary'));
    if(f) return {card:f};
  }
  const mons = ok.filter(c=>CARDS[c.id].type==='monster' && !CARDS[c.id].evolveFrom).sort((a,b)=>CARDS[b.id].cost-CARDS[a.id].cost);
  if(mons.length) return {card:mons[0]};
  if(fb){
    const killable = enemies.filter(m=>m.hp<=CARDS.fireball.dmg).sort((a,b)=>atkOf(0,b)-atkOf(0,a));
    if(killable.length) return {card:fb,target:killable[0]};
    if(!enemies.length) return {card:fb,target:'face'};
  }
  const bk = find('book');
  if(bk && p.hand.length<=3) return {card:bk};
  const hl = find('heal'); if(hl) return {card:hl};
  return null;
}

function cpuPickAttack(m){
  const enemies=blockers(0), a=atkOf(1,m);
  if(!enemies.length) return 'face';
  const opts = enemies.map(e=>({e, kill:e.hp<=a, die:m.hp<=atkOf(0,e), eAtk:atkOf(0,e)})).sort((x,y)=>y.eAtk-x.eAtk);
  const best = opts.find(x=>x.kill && !x.die) || opts.find(x=>x.kill && x.eAtk>=a) || opts.find(x=>!x.die);
  if(best) return best.e;
  return CONFIG.mustAttackMonsters ? null : 'face';
}

/* ===== 対戦中のプレイヤー操作 ===== */
function setHint(key,params,warn){ if(!S) return; S.hint=key; S.hintP=params||null; S.warn=!!warn; }
async function run(fn){
  const gid=S.gid; S.busy=true; render();
  try{ await fn(); } finally { if(alive(gid)){ S.busy=false; render(); } }
}

function clickHand(c){
  if(S.sel?.card===c){ S.sel=null; return; }
  S.sel=null;
  const why=canPlay(0,c);
  if(why){ setHint(why[0],why[1],true); return; }
  setHint(null);
  const d=CARDS[c.id];
  if(d.evolveFrom){
    const ts=evoTargets(0,d);
    if(ts.length===1) run(()=>playAnimated(0,c,ts[0]));
    else S.sel={kind:'evolve',card:c};
    return;
  }
  if(c.id==='fireball' || c.id==='chain'){ S.sel={kind:'spell',card:c}; return; }
  if(c.id==='guard'){
    const own=S.p[0].field.filter(Boolean);
    if(own.length===1) run(()=>playAnimated(0,c,own[0]));
    else S.sel={kind:'ally',card:c};
    return;
  }
  run(()=>playAnimated(0,c));
}

function resolveTarget(tg){
  const sel=S.sel; if(!sel) return;
  if(sel.kind==='attack'){
    if(tg==='face' && CONFIG.mustAttackMonsters && blockers(1).length){ setHint('w.face',null,true); return; }
    if(tg!=='face' && tg.guarded){ setHint('w.guarded',null,true); return; }
    S.sel=null; setHint(null); run(()=>attackAnimated(0,sel.m,tg));
  } else if(sel.kind==='spell'){
    if(tg==='face' && sel.card.id==='chain'){ setHint('w.monOnly',{c:'@chain'},true); return; }
    S.sel=null; setHint(null); run(()=>playAnimated(0,sel.card,tg));
  }
}

function heroIsTarget(){
  if(!S) return false;
  const sel=S.sel, myTurn=S.turn===0 && !S.over && !S.busy;
  return !!(myTurn && sel && ((sel.kind==='spell' && sel.card.id==='fireball') || (sel.kind==='attack' && (!CONFIG.mustAttackMonsters || !blockers(1).length))));
}

function battleAct(act,data){
  if(act==='again'){ startMatch(S?.mode||'practice', S?.friendIdx); return; }
  if(act==='menu'){ toMenu(); return; }
  if(act==='vr'){ startXR('immersive-vr'); return; }
  if(act==='mr'){ startXR('immersive-ar'); return; }
  if(act==='view'){ SV.settings.view=(SV.settings.view+1)%VIEWS.length; viewIdx=SV.settings.view; save(); fitCamera(); applyI18n(); return; }
  if(act==='log'){ $('#logbox').classList.toggle('open'); return; }
  if(act==='rules'){ showRules(); return; }
  if(!S || S.over || S.busy || S.turn!==0) return;
  if(act==='end'){ S.sel=null; endTurn(); return; }
  if(act==='hand'){ const c=S.p[0].hand.find(c=>String(c.uid)===String(data.uid)); if(c) clickHand(c); }
  else if(act==='mon'){
    const pi=+data.pi, m=S.p[pi].field[+data.i];
    if(!m){ if(S.sel){ S.sel=null; setHint(null); } render(); return; }
    if(pi===0){
      if(S.sel?.kind==='evolve'){
        const sel=S.sel, d=CARDS[sel.card.id];
        if(evoTargets(0,d).includes(m)){ S.sel=null; setHint(null); run(()=>playAnimated(0,sel.card,m)); }
        else setHint('w.evolveTarget',{c:'@'+d.evolveFrom},true);
      }
      else if(S.sel?.kind==='ally'){ const sel=S.sel; S.sel=null; setHint(null); run(()=>playAnimated(0,sel.card,m)); }
      else if(S.sel?.kind==='attack' && S.sel.m===m){ S.sel=null; setHint(null); }
      else if(m.canAttack){ S.sel={kind:'attack',m}; setHint(null); }
      else setHint(m.frozen?'w.frozen':'w.tired',null,true);
    } else resolveTarget(m);
  }
  else if(act==='hero' && String(data.pi)==='1') resolveTarget('face');
  render();
}

/* ===== 対戦画面の表示（HUD） ===== */
function pips(n,max,cls){ let s=''; for(let i=0;i<max;i++) s+=`<span class="pip ${cls} ${i<n?'on':''}"></span>`; return `<span class="pips">${s}</span>`; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cardBody(id){
  const d=CARDS[id];
  const stats = d.type==='monster'
    ? `${d.tag?`<span class="text">${esc(cardText(id))}</span>`:''}<span class="stats"><b class="atk">${d.atk}</b><b class="hp">${d.hp}</b></span>`
    : `<span class="text">${esc(cardText(id))}</span>`;
  return `<span class="cost">${d.cost}</span><span class="kind">${esc(cardMotif(id))}</span><span class="glyph" aria-hidden="true">${d.glyph}</span><span class="name">${esc(cardName(id))}</span>${stats}`;
}
function cardHTML(id,extra=''){ return `<div class="card el-${CARDS[id].el} ${extra}">${cardBody(id)}</div>`; }
function panelHTML(pi){
  const p=S.p[pi];
  return `<span class="who">${esc(who(pi))}</span>
    <span class="lbl">${t('hud.life')}</span>${pips(p.life,CONFIG.maxLife,'life')}<span class="num">${p.life}</span>

    ${p.fieldCard?`<span class="fbadge el-${CARDS[p.fieldCard].el}">${esc(cardName(p.fieldCard))}</span>`:''}`;

function render(){
  if(!S) return;
  const ep=$('#enemyPanel'), mp=$('#mePanel');
  ep.innerHTML=panelHTML(1); mp.innerHTML=panelHTML(0);
  ep.classList.toggle('target',heroIsTarget()); ep.classList.toggle('active',S.turn===1);
  mp.classList.toggle('active',S.turn===0);

  const me=S.p[0], myTurn=S.turn===0 && !S.over && !S.busy;
  $('#hand').innerHTML = me.hand.map(c=>{
    const d=CARDS[c.id], cls=['card','el-'+d.el];
    cls.push(myTurn && !canPlay(0,c) ? 'playable' : 'dim');
    if(S.sel?.card===c) cls.push('selected');
    return `<button class="${cls.join(' ')}" data-act="hand" data-uid="${c.uid}">${cardBody(c.id)}</button>`;
  }).join('') || `<span class="meta">${t('hud.noHand')}</span>`;

  let hint = S.hint ? t(S.hint,S.hintP) : '';
  if(!hint){
    if(S.over) hint=t('h.over');
    else if(S.turn!==0) hint=t('h.opp');
    else if(S.busy) hint='';
    else if(S.sel?.kind==='attack') hint=t('h.attack');
    else if(S.sel?.kind==='evolve') hint=t('h.evolve',{c:'@'+CARDS[S.sel.card.id].evolveFrom});
    else if(S.sel?.kind==='ally') hint=t('h.ally');
    else if(S.sel?.kind==='spell') hint=t('h.spell',{c:'@'+S.sel.card.id});
    else hint=t('h.default');
  }
  const h=$('#hint'); h.textContent=`${t('hud.turn',{n:S.turnNo})}　${hint}`; h.classList.toggle('warn',S.warn);
  $('#endBtn').disabled=!myTurn;
  $('#log').innerHTML = S.log.map(l=>`<li class="${l.pi==null?'':'p'+l.pi}">${esc(t(l.key,l.params))}</li>`).join('');

  const oi=$('#openInfo');
  if(S.open){
    const col=pi=>`<div><b>${esc(who(pi))}</b><ol>${S.p[pi].deck.slice(0,5).map(c=>`<li class="el-${CARDS[c.id].el}">${esc(cardName(c.id))}</li>`).join('')}</ol></div>`;
    oi.innerHTML=`<span class="lbl">${t('hud.order')}</span><div class="oi-cols">${col(0)}${col(1)}</div>`; oi.hidden=false;
  } else oi.hidden=true;

  sync3D();
  if(renderer?.xr.isPresenting) updateXRHud();
  flushFx();

  if(S.over && !S.overShown){
    S.overShown=true; const gid=S.gid;
    shatterCrystal(1-S.winner);
    setTimeout(()=>{
      if(!alive(gid)) return;
      const ov=$('#overlay'), win=S.winner===0;
      ov.innerHTML=`<div class="ov"><p>${t('over.turns',{n:S.turnNo})}</p><h2>${t(win?'over.win':'over.lose')}</h2>${win?`<p class="gain">${t('pack.gotPoints',{n:CONFIG.winPoints})}</p>`:''}<div class="row"><button class="endbtn" data-act="again">${t('over.again')}</button><button class="ghost-btn" data-act="menu">${t('over.menu')}</button></div></div>`;
      ov.hidden=false;
    }, 1300);
  }
}

function cutIn(pi,id){
  const el=$('#cutin'), d=CARDS[id];
  const verb = d.type==='monster' ? (d.evolveFrom?t('cut.evolve'):t('cut.summon')) : (d.type==='field'?t('cut.field'):t('cut.cast'));
  el.innerHTML=`<div class="cut ${pi?'foe':'me'}"><span class="cap">${esc(who(pi))}　${verb}</span>${cardHTML(id)}</div>`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function showBanner(text,cls){ const el=$('#banner'); el.textContent=text; el.className=cls; void el.offsetWidth; el.classList.add('show'); }
function flash(){ const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }

function flushFx(){
  if(renderer?.xr.isPresenting){
    for(const [k,tx,cls] of S.fx){ float3D(keyPos(k),tx,cls); if(cls==='dmg'){ if(k[0]==='h') crystalHit(+k[1]); else { const m=S.p[+k[1]].field[+k[2]]; const e=m&&models.get(m.uid); if(e) e.shakeT=.4; } } }
    S.fx=[]; return;
  }
  const layer=$('#fx'), W=innerWidth, H=innerHeight, bottomLimit=H-$('.hud-bottom').offsetHeight-30;
  for(const [k,tx,cls] of S.fx){
    const p=keyPos(k).project(camera);
    let x=(p.x+1)/2*W, y=(1-p.y)/2*H;
    x=Math.min(W-30,Math.max(30,x)); y=Math.min(bottomLimit,Math.max(70,y));
    const s=document.createElement('span');
    s.className='float '+cls; s.textContent=tx; s.style.left=x+'px'; s.style.top=y+'px';
    layer.append(s); setTimeout(()=>s.remove(),1050);
    if(cls==='dmg'){
      if(k[0]==='h'){ crystalHit(+k[1]); const panel=k[1]==='0'?$('#mePanel'):$('#enemyPanel'); panel.classList.remove('hit'); void panel.offsetWidth; panel.classList.add('hit'); }
      else { const m=S.p[+k[1]].field[+k[2]]; const e=m&&models.get(m.uid); if(e) e.shakeT=.4; }
    }
  }
  S.fx=[];
}

/* ----- 1日1パック ----- */
function dayKey(d=new Date()){ const x=new Date(d.getTime()-CONFIG.dailyResetHour*3600e3); return `${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`; }
function canOpenPack(){ return SV.settings.test || SV.lastPack!==dayKey(); }
function nextReset(){ const now=new Date(), r=new Date(now); r.setHours(CONFIG.dailyResetHour,0,0,0); if(r<=now) r.setDate(r.getDate()+1); return r; }
function fmtLeft(ms){ const h=Math.floor(ms/3600e3), m=Math.floor(ms%3600e3/60e3); return `${h}:${String(m).padStart(2,'0')}`; }
function rollRarity(){ const r=Math.random(); let acc=0; for(const [k,v] of Object.entries(RARITY)){ acc+=v.rate; if(r<acc) return k; } return 'C'; }
function rollPack(){
  const god=Math.random()<CONFIG.godPackRate, cards=[];
  for(let i=0;i<CONFIG.packSize;i++){ const rar=god?'R':rollRarity(); const pool=CARD_IDS.filter(id=>CARDS[id].rarity===rar); cards.push(pool[Math.floor(Math.random()*pool.length)]); }
  return {god,cards};
}
// 中身は開ける前に決めて保存する（再読み込みで引き直せないように）
function ensurePending(){ if(!SV.pending){ SV.pending={...rollPack(), seed:Math.floor(Math.random()*1e9)}; save(); } return SV.pending; }
function rng(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0; let x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }
function todName(){ const h=new Date().getHours(); return h<5?'night':h<10?'morning':h<16?'day':h<19?'evening':'night'; }
// 謎の仕掛け1〜4は見た目だけ。5（神パックの予兆）だけが中身と結びついている
function packLook(){ const p=ensurePending(), r=rng(p.seed); return { corner:Math.floor(r()*5), seal:((r()-.5)*16).toFixed(1), shine:Math.round(10+r()*80), tod:todName(), omen:p.god }; }

function bindPackDrag(){
  const el=$('#pack'); if(!el || el.classList.contains('locked')) return;
  let st=null;
  el.addEventListener('pointerdown',e=>{ st={x:e.clientX,t:performance.now(),w:el.offsetWidth}; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove',e=>{
    if(!st) return;
    const dx=Math.abs(e.clientX-st.x), k=Math.min(1,dx/(st.w*.7));
    el.style.setProperty('--tear',k);
    if(k>=1){ const sp=dx/Math.max(1,performance.now()-st.t); st=null; el.classList.add('torn'); setTimeout(()=>openPack(sp),300); }
  });
  const stop=()=>{ if(st){ st=null; el.style.setProperty('--tear',0); } };
  el.addEventListener('pointerup',stop); el.addEventListener('pointercancel',stop);
}
function openPack(speed){
  if(!canOpenPack()) return;
  const pk=ensurePending(), before={...SV.collection};
  pk.cards.forEach(id=>{ SV.collection[id]=(SV.collection[id]||0)+1; });
  SV.points+=CONFIG.packPoints;
  if(!SV.settings.test) SV.lastPack=dayKey();
  SV.pending=null; save();
  const seen={};
  PACK={ cards:pk.cards, god:pk.god, flipped:pk.cards.map(()=>false), fast:speed>1.2,
         isNew:pk.cards.map(id=>{ const n=!before[id] && !seen[id]; seen[id]=true; return n; }) };
  renderPackModal();
  renderApp();
}
function renderPackModal(){
  const P=PACK, hide=SV.settings.hideLast;
  showModal(`${P.god?`<p class="godline">${t('pack.god')}</p>`:''}
    <div class="reveal ${P.fast?'fast':'slow'}">${P.cards.map((id,i)=>{
      const last=hide && i===P.cards.length-1;
      return `<button class="flip r-${CARDS[id].rarity} ${last?'last':''}" data-act="flip" data-i="${i}" aria-label="${t('pack.tap')}"><span class="flip-in"><span class="face back"><span>GATE</span>${last?'<em>?</em>':''}</span><span class="face front">${cardHTML(id)}${P.isNew[i]?'<span class="newb">NEW</span>':''}<span class="rar">${RARITY[CARDS[id].rarity].mark}</span></span></span></button>`;
    }).join('')}</div>
    <p class="meta center">${t('pack.gotPoints',{n:CONFIG.packPoints})}</p>
    <div class="row center" id="packActions"><button class="ghost-btn" data-act="flipAll">${t('pack.flipAll')}</button></div>`,'pack-modal');
}
function flipCard(i,el){
  if(!PACK || PACK.flipped[i]) return;
  PACK.flipped[i]=true;
  (el||document.querySelector(`.flip[data-i="${i}"]`))?.classList.add('on');
  if(CARDS[PACK.cards[i]].rarity==='R') flash();
  if(PACK.flipped.every(Boolean)) $('#packActions').innerHTML=`<button class="btn" data-act="collect">${t('pack.done')}</button>`;
}
function flipAll(){
  if(!PACK) return;
  const hide=SV.settings.hideLast, last=PACK.cards.length-1;
  PACK.cards.forEach((_,i)=>{ if(hide && i===last) return; setTimeout(()=>flipCard(i),i*160); });
}

/* ----- 操作の振り分け ----- */
function appAct(act,d,el){
  switch(act){
    case 'tab': APP.tab=d.tab; APP.editing=null; APP.resetArm=false; renderApp(); return;
    case 'goDecks': APP.tab='cards'; APP.cardsSub='decks'; APP.editing=null; renderApp(); return;
    case 'sub': APP.cardsSub=d.sub; APP.editing=null; renderApp(); return;
    case 'filter': APP.filter=d.f; renderApp(true); return;
    case 'card': showCard(d.id); return;
    case 'craft': { const c=RARITY[CARDS[d.id].rarity].craft; if(SV.points<c){ toast(t('craftNo')); return; } SV.points-=c; SV.collection[d.id]=(SV.collection[d.id]||0)+1; save(); toast(t('crafted')); showCard(d.id); renderApp(true); return; }
    case 'closeModal': closeModal(); return;
    case 'openPack': openPack(1); return;
    case 'flip': flipCard(+d.i,el); return;
    case 'flipAll': flipAll(); return;
    case 'collect': closeModal(); renderApp(); return;
    case 'odds': showOdds(); return;
    case 'rules': showRules(); return;
    case 'deckEdit': APP.editing=+d.i; renderApp(); return;
    case 'deckBack': APP.editing=null; renderApp(); return;
    case 'deckUse': SV.active=+d.i; save(); renderApp(true); return;
    case 'deckAdd': deckAdd(d.id); return;
    case 'deckRemove': { const c=SV.decks[APP.editing].cards; if(c[d.id]>1) c[d.id]--; else delete c[d.id]; save(); renderApp(true); return; }
    case 'deckClear': SV.decks[APP.editing].cards={}; save(); renderApp(true); return;
    case 'deckImport': deckImport(); return;
    case 'copy': copyFrom(d.src); return;
    case 'addFriend': addFriend(); return;
    case 'friendBattle': startMatch('friend',+d.i); return;
    case 'friendRemove': SV.friends.splice(+d.i,1); save(); renderApp(true); return;
    case 'startPractice': startMatch('practice'); return;
    case 'startOpen': startMatch('open'); return;
    case 'startFriend': startMatch('friend',+($('#friendSel')?.value||0)); return;
    case 'lang': SV.lang=d.v; setLang(d.v); save(); renderApp(true); if(S) render(); return;
    case 'speed': SV.settings.speed=+d.v; CONFIG.animSpeed=+d.v; save(); renderApp(true); return;
    case 'viewSet': SV.settings.view=+d.v; viewIdx=+d.v; save(); fitCamera(); renderApp(true); return;
    case 'hideLast': SV.settings.hideLast=d.v==='1'; save(); renderApp(true); return;
    case 'test': SV.settings.test=d.v==='1'; save(); renderApp(true); return;
    case 'reset':
      if(!APP.resetArm){ APP.resetArm=true; renderApp(true); return; }
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      SV=defSave(); setLang(SV.lang); CONFIG.animSpeed=1; viewIdx=0; APP.resetArm=false; APP.tab='home'; renderApp(); return;
  }
  battleAct(act,d);
}

let camBase=new THREE.Vector3(), camLook=new THREE.Vector3(), shakeAmt=0, viewIdx=0;

  { name:'俯瞰', dir:[0,.80,.60], look:[0,0,.4],    dist:14   },
  { name:'臨場', dir:[0,.36,.93], look:[0,.7,-1.4], dist:10.5 },
];
const models=new Map(), fieldEnts=[null,null], hitList=[], tweens=[], bursts=[];
const SLOT_X=[-2.6,0,2.6], SLOT_Z=2.3;
const CRYSTAL=[new THREE.Vector3(0,1.3,5.3), new THREE.Vector3(0,1.3,-5.3)];
const crystals=[];
const LABEL_Y={ drake:1.45, dragon:2.5, golem:2.15, knight:2.45, scout:2.0 };
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const easeOut=k=>1-Math.pow(1-k,3);
const easeBack=k=>{ const c=1.7; return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2); };
function slotPos(pi,i){ return V(SLOT_X[i],0,pi===0?SLOT_Z:-SLOT_Z); }
function keyPos(k){ if(k[0]==='h') return CRYSTAL[+k[1]].clone().add(V(0,1,0)); return slotPos(+k[1],+k[2]).add(V(0,2.1,0)); }
function tween(dur,fn){ return new Promise(res=>tweens.push({t:0,dur:dur/CONFIG.animSpeed,fn,res})); }

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function wrapText(g,text,maxW,maxLines){
  const cjk=/[぀-ヿ㐀-鿿가-힯]/.test(text);
  const tokens=cjk?[...text]:text.split(/(\s+)/);
  const out=[]; let line='';
  for(const tk of tokens){
    const test=line+tk;
    if(g.measureText(test).width>maxW && line.trim()){ out.push(line.trim()); line=tk.trim()?tk:''; if(out.length>=maxLines) return out; }
    else line=test;
  }
  if(line.trim() && out.length<maxLines) out.push(line.trim());
  return out;
}

function M(color,o={}){ return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.55,metalness:.15,flatShading:true},o)); }
function add(g,geo,mat,x,y,z,sx=1,sy=1,sz=1){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.castShadow=true; g.add(m); return m; }
function wingGeo(){ const s=new THREE.Shape(); s.moveTo(0,0); s.lineTo(.5,.45); s.lineTo(1.35,.55); s.lineTo(1.05,.05); s.lineTo(1.15,-.25); s.lineTo(.7,-.15); s.lineTo(.55,-.45); s.lineTo(0,-.2); return new THREE.ShapeGeometry(s); }
function addWings(g,mat,x,y,z,size){
  const ws=[];
  for(const side of [1,-1]){
    const pivot=new THREE.Group(); pivot.position.set(side*x,y,z); pivot.scale.set(side*size,size,size);
    const w=new THREE.Mesh(wingGeo(),mat); w.rotation.x=-Math.PI/2+.25; w.castShadow=true; pivot.add(w);

}

/* --- エンティティ --- */
function createEnt(m,pi,i){
  const root=new THREE.Group(); root.position.copy(slotPos(pi,i));
  const card=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.1), new THREE.MeshStandardMaterial({map:cardTex(m.id),roughness:.7}));
  card.rotation.x=-Math.PI/2; card.rotation.z=pi?Math.PI:0; card.position.y=.02; card.receiveShadow=true;
  const ring=new THREE.Mesh(new THREE.RingGeometry(.98,1.16,48), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.04; ring.visible=false;
  const holder=new THREE.Group();
  const model=buildMonster(m.id); model.rotation.y=pi?Math.PI:0;
  const pivot=new THREE.Group(); pivot.add(model); holder.add(pivot);
  const label=makeLabel(); label.position.y=LABEL_Y[m.id]||2; holder.add(label);
  root.add(card,ring,holder); world.add(root);
  return { root, card, ring, holder, pivot, model, label, pi, uid:m.uid, id:m.id, lift:0, liftT:0, shakeT:0, phase:Math.random()*6, chain:null };
}
function removeEnt(e,withFx){
  if(withFx){
    const p=e.root.position.clone().add(e.holder.position).add(V(0,.9,0));
    burst(p,EL[CARDS[e.id].el],90,5,1.0,.22); burst(p,'#ffffff',30,3,.5,.3); shake(.3);
    tween(.3,k=>{ e.holder.scale.setScalar(1-k); e.card.material.opacity=1-k; e.card.material.transparent=true; }).then(()=>world.remove(e.root));
  } else world.remove(e.root);
}
function updateEnt(e,m,pi){
  const sel=S?.sel, myTurn=S.turn===0 && !S.over && !S.busy;
  const badge = m.frozen ? '封' : m.guarded ? '護' : (pi===0 && S.turn===0 && !m.canAttack ? '休' : '');
  drawLabel(e.label, atkOf(pi,m), m.hp, m.maxHp, atkOf(pi,m)>m.atk, badge);
  let st=null;
  if(pi===0){
    if(sel?.kind==='attack' && sel.m===m) st='sel';
    else if(sel?.kind==='evolve' && evoTargets(0,CARDS[sel.card.id]).includes(m)) st='evo';
    else if(sel?.kind==='ally') st='ally';
    else if(myTurn && !sel && m.canAttack) st='ready';
  } else if(myTurn && sel && sel.kind!=='evolve' && sel.kind!=='ally' && !(sel.kind==='attack' && m.guarded)) st='target';
  e.ringState=st; e.ring.visible=!!st;
  if(st) e.ring.material.color.set({ready:'#d9b45f',sel:'#ffffff',evo:'#ff7a2a',ally:'#f2e2a8',target:'#ff4a3a'}[st]);
  e.liftT = st==='sel' ? .45 : 0;
  if(m.frozen && !e.chain){
    const mat=new THREE.MeshBasicMaterial({color:0xa88be0,transparent:true,opacity:.9,blending:THREE.AdditiveBlending});
    const g=new THREE.Group();
    for(let k=0;k<2;k++){ const t=new THREE.Mesh(new THREE.TorusGeometry(.75,.045,6,28),mat); t.rotation.x=Math.PI/2; t.rotation.y=k?.5:-.5; g.add(t); }
    g.position.y=.9; e.holder.add(g); e.chain=g;
  } else if(!m.frozen && e.chain){ e.holder.remove(e.chain); e.chain=null; }
  if(m.guarded && !e.dome){
    const d=new THREE.Mesh(new THREE.SphereGeometry(1.15,24,12,0,Math.PI*2,0,Math.PI/2), new THREE.MeshBasicMaterial({color:col(EL.ward),transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,wireframe:false}));
    const w=new THREE.Mesh(d.geometry, new THREE.MeshBasicMaterial({color:col(EL.ward),transparent:true,opacity:.35,wireframe:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    const g=new THREE.Group(); g.add(d,w); g.scale.setScalar(.01); e.root.add(g); e.dome=g;
    tween(.5,k=>g.scale.set(easeBack(k),easeBack(k)*1.6,easeBack(k)));
  } else if(!m.guarded && e.dome){ e.root.remove(e.dome); e.dome=null; }
}

function sync3D(){
  if(!scene || !S) return;
  const alive=new Set();
  for(const pi of [0,1]) S.p[pi].field.forEach((m,i)=>{
    if(!m) return; alive.add(m.uid);
    let e=models.get(m.uid);
    if(!e){
      let evo=false;
      if(m.evolvedFrom && models.has(m.evolvedFrom)){ removeEnt(models.get(m.evolvedFrom),false); models.delete(m.evolvedFrom); evo=true; }
      e=createEnt(m,pi,i); models.set(m.uid,e);
      evo ? evolveFx(e) : summonFx(e);
    }
    updateEnt(e,m,pi);
  });
  for(const [uid,e] of models) if(!alive.has(uid)){ removeEnt(e,true); models.delete(uid); }
  syncFields(); syncCrystals();
}

function syncFields(){
  for(const pi of [0,1]){
    const id=S.p[pi].fieldCard, cur=fieldEnts[pi];
    if((cur?.id||null)===id) continue;
    if(cur){ world.remove(cur.group); fieldEnts[pi]=null; }
    if(!id) continue;
    const d=CARDS[id], z=pi?-SLOT_Z:SLOT_Z, group=new THREE.Group();
    const card=new THREE.Mesh(new THREE.PlaneGeometry(1.45,2.0), new THREE.MeshStandardMaterial({map:cardTex(id),roughness:.7,emissive:col(EL[d.el]),emissiveIntensity:.15}));
    card.rotation.x=-Math.PI/2; card.rotation.z=pi?Math.PI:0; card.position.set(4.9,.03,z);
    const tint=new THREE.Mesh(new THREE.PlaneGeometry(12,6.6), new THREE.MeshBasicMaterial({color:col(EL[d.el]),transparent:true,opacity:.07,blending:THREE.AdditiveBlending,depthWrite:false}));
    tint.rotation.x=-Math.PI/2; tint.position.set(0,.015,pi?-3.4:3.4);
    const rune=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.8), new THREE.MeshBasicMaterial({map:CIRCLE_TEX,color:col(EL[d.el]),transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false}));
    rune.rotation.x=-Math.PI/2; rune.position.set(4.9,.05,z);

/* --- エフェクト --- */
function burst(pos,color,n=40,speed=4,life=.8,size=.2,gravity=4){
  const arr=new Float32Array(n*3), vel=[];
  for(let i=0;i<n;i++){
    arr[i*3]=pos.x; arr[i*3+1]=pos.y; arr[i*3+2]=pos.z;
    vel.push(V(Math.random()-.5,Math.random()*.8+.2,Math.random()-.5).normalize().multiplyScalar(speed*(.3+Math.random()*.7)));
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const mat=new THREE.PointsMaterial({color:col(color),size:size*WS,map:DOT_TEX,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(geo,mat); world.add(pts);
  bursts.push({pts,vel,age:0,life:life/CONFIG.animSpeed,gravity});
}
function updateBursts(dt){
  for(let j=bursts.length-1;j>=0;j--){
    const b=bursts[j]; b.age+=dt;
    const a=b.pts.geometry.attributes.position, arr=a.array;
    for(let i=0;i<b.vel.length;i++){ const v=b.vel[i]; arr[i*3]+=v.x*dt; arr[i*3+1]+=v.y*dt; arr[i*3+2]+=v.z*dt; v.y-=b.gravity*dt; v.multiplyScalar(.985); }
    a.needsUpdate=true; b.pts.material.opacity=Math.max(0,1-b.age/b.life);
    if(b.age>=b.life){ world.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(j,1); }
  }
}
function magicCircle(pos,color,size,dur){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:CIRCLE_TEX,color:col(color),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2; m.position.copy(pos); world.add(m);
  return tween(dur,k=>{ m.scale.setScalar(size*(.3+.7*easeOut(Math.min(1,k*2)))); m.rotation.z=k*3; m.material.opacity=k<.2?k*5:(1-k)/.8; }).then(()=>{ world.remove(m); m.material.dispose(); });
}
function pillar(pos,color,h,dur,r=.8){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28,1,true), new THREE.MeshBasicMaterial({color:col(color),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.copy(pos); m.position.y=h/2; world.add(m);
  return tween(dur,k=>{ m.scale.set(1-k*.5,easeOut(Math.min(1,k*3)),1-k*.5); m.material.opacity=(1-k)*.55; }).then(()=>{ world.remove(m); m.material.dispose(); });
}

async function projectile(a,b,color){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10), new THREE.MeshBasicMaterial({color:col(color)}));
  const halo=new THREE.Mesh(new THREE.SphereGeometry(.45,12,10), new THREE.MeshBasicMaterial({color:col(color),transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));

  });

function pick(e){
  const ndc=new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(hitList,false);
  return hits.length ? hits[0].object.userData : null;
}
function fitCamera(){
  if(renderer.xr.isPresenting) return;
  const W=innerWidth, H=innerHeight; renderer.setSize(W,H);
  camera.aspect=W/H;
  const v=VIEWS[viewIdx], vf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const needHalf = viewIdx===0 ? 6.6 : 5.4;
  const dist=Math.max(v.dist, needHalf/(vf*camera.aspect)*.92);
  camLook.set(...v.look);
  camBase.set(...v.dir).normalize().multiplyScalar(dist).add(camLook);
  scene.fog.near=dist+4; scene.fog.far=dist+26;
  const hb=document.querySelector('.hud-bottom'), ht=document.querySelector('.hud-top');
  const off=((hb?hb.offsetHeight:0)-(ht?ht.offsetHeight:0))*.5;
  camera.setViewOffset(W,H,0,off,W,H);
  camera.updateProjectionMatrix();
}
function loop(){
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; if(!tw) continue; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur); tw.fn(k); if(k>=1){ tweens.splice(i,1); tw.res(); } }
  updateBursts(dt);
  for(const e of models.values()){
    e.lift+=(e.liftT-e.lift)*Math.min(1,dt*10);
    const amp=e.model.userData.flyer?.12:.05;
    e.pivot.position.y=e.lift+Math.sin(t*2+e.phase)*amp+(e.model.userData.flyer?.15:0);
    e.pivot.position.x=e.shakeT>0?Math.sin(t*90)*.1*e.shakeT/.4:0; if(e.shakeT>0) e.shakeT-=dt;
    const ws=e.model.userData.wings; if(ws) for(const w of ws) w.rotation.z=w.userData.side*(.35+Math.sin(t*e.model.userData.flap+e.phase)*.4);
    if(e.model.userData.sword) e.model.userData.sword.rotation.z=Math.sin(t*1.5+e.phase)*.08;
    if(e.ring.visible){ e.ring.material.opacity=.55+Math.sin(t*5)*.3; e.ring.rotation.z=t*.6; }
    if(e.chain) e.chain.rotation.y=t*1.2;
    if(e.dome) e.dome.rotation.y=t*.4;
  }
  for(const c of crystals){
    c.gem.rotation.y=t*.8; c.orbs.rotation.y=-t*1.4;
    c.list.forEach((o,i)=>{ const a=i/c.list.length*Math.PI*2; o.position.set(Math.cos(a)*1.0,Math.sin(t*2+i)*.15,Math.sin(a)*1.0); });
    if(c.hitT>0){ c.hitT-=dt; c.gem.scale.set(1+c.hitT*.6,1.5+c.hitT*.6,1+c.hitT*.6); } else c.gem.scale.set(1,1.5,1);
    c.gem.position.y=Math.sin(t*1.6)*.1;
    if(c.ring.visible){ c.ring.material.opacity=.55+Math.sin(t*5)*.3; }
  }
  for(const f of fieldEnts) if(f) f.rune.rotation.z=t*.5;
  scene.traverse(o=>{ if(o.userData.spin) o.rotation.y=t; });
  const ma=_motes.geometry.attributes.position; for(let i=0;i<ma.count;i++){ let y=ma.array[i*3+1]+dt*.25; if(y>8) y=0; ma.array[i*3+1]=y; } ma.needsUpdate=true;
  if(!S && !renderer.xr.isPresenting){ const a=t*.07; camera.position.set(Math.sin(a)*15,9.5,Math.cos(a)*15); camera.lookAt(0,0,0); renderer.render(scene,camera); return; }
  camera.position.copy(camBase);
  if(shakeAmt>0){ camera.position.x+=(Math.random()-.5)*shakeAmt; camera.position.y+=(Math.random()-.5)*shakeAmt; shakeAmt=Math.max(0,shakeAmt-dt*1.6); }
  camera.lookAt(camLook);
  renderer.render(scene,camera);
}

  for(const pi of [0,1]){ if(fieldEnts[pi]) world.remove(fieldEnts[pi].group); fieldEnts[pi]=null; }

}

async function startXR(mode){
  if(!navigator.xr) return;
  try{
    const session=await navigator.xr.requestSession(mode,{optionalFeatures:['local-floor','hand-tracking']});
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);
    xrMode=mode; enterXR();
    session.addEventListener('end',exitXR);
  }catch(e){ if(S){ setHint('w.xr',null,true); render(); } }
}
function enterXR(){
  xrSaved={fog:scene.fog,bg:scene.background};
  WS=XR.scale; world.scale.setScalar(WS); world.position.set(0,SV.settings.tableHeight,-XR.tableDistance);
  scene.fog=null;

function exitXR(){
  WS=1; world.scale.setScalar(1); world.position.set(0,0,0);

}

function onXRSelect(e){
  const ctl=e.target, rot=new THREE.Matrix4().extractRotation(ctl.matrixWorld);

}

  fitFont(g,l2,940,36,'bold',UIFONT); g.fillText(l2,40,130);
  const l3=`${t('hud.energy')} ${'◆'.repeat(me.energy)}${'◇'.repeat(Math.max(0,CONFIG.maxEnergy-me.energy))}　${t('hud.deckhand',{d:me.deck.length,h:me.hand.length})}`;
  fitFont(g,l3,940,36,'bold',UIFONT); g.fillText(l3,40,182);
  g.fillStyle=S.warn?'#ff6a55':'#93a8a1';
  const line = S.over ? t('over.restart') : (S.hint ? t(S.hint,S.hintP) : (S.log[0] ? t(S.log[0].key,S.log[0].params) : ''));
  g.font=`30px ${UIFONT}`; g.fillText(wrapText(g,line,940,1)[0]||'',40,244);
  xrStatus.material.map.needsUpdate=true;
  const bc=xrEnd.userData.c, bg=bc.getContext('2d');
  bg.fillStyle=(myTurn||S.over)?'#d9b45f':'#3a4a46'; bg.fillRect(0,0,256,96);
  bg.fillStyle='#111'; bg.textAlign='center'; bg.textBaseline='middle';
  const bl=S.over?t('over.again'):t('hud.end'); fitFont(bg,bl,236,40,'bold',UIFONT); bg.fillText(bl,128,50);
  xrEnd.material[2].map.needsUpdate=true;
  while(xrHand.children.length){ const gr=xrHand.children[0]; gr.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); }); xrHand.remove(gr); }
  xrHits=[];
  const n=me.hand.length, gap=1.75;
  me.hand.forEach((card,i)=>{
    const ok=myTurn && !canPlay(0,card), sel=S.sel?.card===card;
    const grp=new THREE.Group();
    grp.position.set((i-(n-1)/2)*gap, sel?1.3:.9, 6.7); grp.rotation.x=-1.05;
    const glow=new THREE.Mesh(new THREE.PlaneGeometry(1.7,2.3), new THREE.MeshBasicMaterial({color:sel?0xffffff:(ok?0xd9b45f:0x2f4741),transparent:true,opacity:ok||sel?.9:.5}));
    glow.position.z=-.01;
    const face=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.1), new THREE.MeshBasicMaterial({map:cardTex(card.id),transparent:true,opacity:ok||sel?1:.55}));
    face.userData={act:'hand',uid:card.uid};
    grp.add(glow,face); xrHand.add(grp); xrHits.push(face);
  });
}
function float3D(pos,text,cls){
  const c=document.createElement('canvas'); c.width=256; c.height=128; const g=c.getContext('2d');
  g.font=cls==='info'?'64px "Dela Gothic One", sans-serif':'bold 84px "JetBrains Mono", monospace';
  g.textAlign='center'; g.textBaseline='middle'; g.lineWidth=10; g.strokeStyle='rgba(0,0,0,.85)';
  g.strokeText(text,128,64); g.fillStyle=cls==='dmg'?'#ff6a55':cls==='heal'?'#5fcf95':'#d9b45f'; g.fillText(text,128,64);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.scale.set(2.4,1.2,1); s.renderOrder=30; s.position.copy(pos); world.add(s);
  const y0=pos.y;
  tween(1.0,k=>{ s.position.y=y0+k*1.2; s.material.opacity=1-k*k; }).then(()=>{ world.remove(s); s.material.map.dispose(); s.material.dispose(); });
}

/* ===== 起動 ===== */
(async()=>{
  SV=loadSave(); setLang(SV.lang); CONFIG.animSpeed=SV.settings.speed||1; viewIdx=SV.settings.view||0;
  try{ await Promise.race([Promise.all([document.fonts.load('40px "Dela Gothic One"'),document.fonts.load('bold 20px "JetBrains Mono"'),document.fonts.load('bold 20px "Zen Kaku Gothic New"')]), new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  init3D();
  $('#loading').remove();
  showApp(true);
  try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
})();
</script>
